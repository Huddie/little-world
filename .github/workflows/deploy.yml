name: Deploy

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - "drizzle/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tailwind.config.ts"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "worker-configuration.d.ts"
      - "wrangler.jsonc"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm exec tsc -p tsconfig.worker.json --noEmit
      - run: pnpm exec tsc -p tsconfig.node.json --noEmit
      - run: pnpm exec vite build
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply little-world --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync Worker secrets
        shell: bash
        run: |
          printf "%s" "$OPENAI_API_KEY" | pnpm exec wrangler secret put OPENAI_API_KEY
          printf "%s" "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY
          printf "%s" "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - name: Deploy Worker and assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
